[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-latent-interfaces"
version = "0.1.0"
description = "Discover, validate, and use native latent interfaces in frozen language models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
  {name = "Josiah Wilson"},
]
dependencies = [
  "numpy>=2.1,<3",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
oli-phase0 = "open_latent_interfaces.phase0:main"
oli-phase01 = "open_latent_interfaces.phase01:main"
oli-native-interface = "open_latent_interfaces.native_coordinates:main"
oli-arithmetic-interface = "open_latent_interfaces.arithmetic_coordinates:main"
oli-operand-reader = "open_latent_interfaces.operand_reader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_latent_interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
